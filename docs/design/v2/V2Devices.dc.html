<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism v2 — Devices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080A}
a{color:#FF4D1A}a:hover{color:#FF7A50}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes newglow{0%,100%{box-shadow:0 0 0 0 rgba(255,77,26,.35)}50%{box-shadow:0 0 0 6px rgba(255,77,26,0)}}
.card{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.dev{transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .25s}.dev:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.16)!important;box-shadow:0 18px 36px rgba(0,0,0,.5)!important}
.btn{transition:background .2s,color .2s,transform .15s}.btn:active{transform:scale(.97)}
.nav{transition:background .2s,color .2s}.nav:hover{background:rgba(255,255,255,.04);color:#F4F5F7}
.live{animation:livedot 1.6s ease-in-out infinite}
.new{animation:newglow 2s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 860px; display: flex; flex-wrap: wrap; color: #F4F5F7; font-family: Inter, system-ui, sans-serif; background: radial-gradient(ellipse 70% 40% at 50% -10%, rgba(255,255,255,.07), rgba(255,255,255,0) 70%), radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 24px 24px, #07080A;">

  <nav aria-label="Main" style="flex: 0 0 220px; box-sizing: border-box; padding: 20px 12px; background: rgba(13,14,17,.8); backdrop-filter: blur(18px); border-right: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 2px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px;">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #FF4D1A, #FF8A3D); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 22px rgba(255,77,26,.5);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#07080A" stroke-width="2.4" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"></path></svg></span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700;">Prism</span>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <sc-if value="{{n.section}}" hint-placeholder-val="{{false}}"><p style="margin: 14px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #7C808A;">{{n.label}}</p></sc-if>
      <sc-if value="{{n.link}}" hint-placeholder-val="{{true}}"><a class="nav" href="{{n.href}}" style="{{n.style}}">{{n.label}}</a></sc-if>
    </sc-for>
  </nav>

  <main style="flex: 999 1 600px; min-width: 0; box-sizing: border-box; padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 18px;">
    <header class="card" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div>
        <p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #7C808A;">DEVICES</p>
        <h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -0.02em;">{{headline}}</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; background: #111216; border: 1px solid rgba(255,255,255,.08); color: #F4F5F7; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Scan again</button>
        <button class="btn" type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; background: #111216; border: 1px solid rgba(255,255,255,.08); color: #F4F5F7; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Import tokens</button>
      </div>
    </header>

    <sc-if value="{{hasNew}}" hint-placeholder-val="{{true}}">
      <section class="card new" aria-label="New device found" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 20px; background: linear-gradient(90deg, rgba(255,77,26,.14), rgba(255,77,26,.03)); border: 1px solid rgba(255,77,26,.45);">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #1E2026; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255,77,26,.35);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF7A50" stroke-width="1.8" aria-hidden="true"><rect x="5" y="6" width="14" height="14" rx="3"></rect><path d="M8 3h8M9 10h6M12 13v4"></path></svg></span>
        <div style="flex: 1 1 280px;"><p style="margin: 0; font-size: 15px; font-weight: 600;">New device found: Air fryer</p><p style="margin: 2px 0 0; font-size: 13px; color: #C9CBD1;">Careli MAF10A on your Wi-Fi (192.168.0.246). Add its token once to control timer and temperature.</p></div>
        <button class="btn" type="button" onClick="{{setUp}}" style="min-height: 42px; padding: 0 18px; border-radius: 999px; border: 0; background: #FF4D1A; color: #07080A; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">Set up</button>
        <button class="btn" type="button" onClick="{{dismiss}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,.12); color: #C9CBD1; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;">Not now</button>
      </section>
    </sc-if>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: baseline; gap: 10px;"><h2 style="margin: 0; font-size: 15px; font-weight: 600;">{{g.title}}</h2><span style="font-size: 12px; color: #7C808A;">{{g.count}}</span></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px;">
          <sc-for list="{{g.items}}" as="d" hint-placeholder-count="4">
            <article class="dev card" style="box-sizing: border-box; padding: 16px; border-radius: 18px; background: linear-gradient(180deg, #14151A, #0F1014); border: 1px solid rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); display: flex; flex-direction: column; gap: 12px; min-height: 168px;">
              <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="{{d.iconBox}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{d.tint}}" stroke-width="1.8" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: {{d.statusColor}};"><span class="live" style="width: 7px; height: 7px; border-radius: 4px; background: {{d.statusColor}};"></span>{{d.status}}</span>
              </div>
              <div>
                <div style="display: flex; align-items: center; gap: 6px;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">{{d.name}}</h3>
                  <button class="btn" type="button" aria-label="Rename {{d.name}}" style="width: 26px; height: 26px; border-radius: 8px; background: transparent; border: 0; color: #7C808A; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button></div>
                <p style="margin: 2px 0 0; font-size: 12px; color: #7C808A;">{{d.model}}</p>
              </div>
              <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.05);">
                <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600;">{{d.readout}}</span>
                <span style="{{d.swatch}}"></span>
              </div>
            </article>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fryer: 'new', t: 0 }; }
  componentDidMount() { this.timer = setInterval(() => this.setState({ t: this.state.t + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state, t = s.t;
    const I = {
      ram: 'M4 7h16v9H4zM7 16v3M11 16v3M15 16v3M7 10h2M11 10h2M15 10h2',
      gpu: 'M3 7h16v10H3zM19 10h2v4h-2M7 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
      board: 'M4 4h16v16H4zM8 8h4v4H8zM15 8h2M15 12h2M8 15h9',
      strip: 'M3 12h18M5 10v4M9 10v4M13 10v4M17 10v4',
      fan: 'M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 10c0-4 1-7 4-7s3 4-2 7M14 12c4 0 7 1 7 4s-4 3-7-2M12 14c0 4-1 7-4 7s-3-4 2-7M10 12c-4 0-7-1-7-4s4-3 7 2',
      pump: 'M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z',
      lamp: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z',
      fryer: 'M5 6h14v14H5zM8 3h8M9 10h6M12 13v4',
      router: 'M4 15h16v5H4zM8 15V9M16 15V9M12 15V5M7 18h1M11 18h1',
      net: 'M3 12a9 9 0 0 1 18 0M6 12a6 6 0 0 1 12 0M9 12a3 3 0 0 1 6 0M12 12v6'
    };
    const box = (c) => 'width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: ' + c + '14; box-shadow: inset 0 0 0 1px ' + c + '33, 0 0 18px ' + c + '22;';
    const sw = (c) => 'width: 22px; height: 22px; border-radius: 11px; background: ' + c + '; box-shadow: 0 0 12px ' + c + ';';
    const none = 'width: 0; height: 0;';
    const dev = (name, model, icon, tint, readout, color, status = 'Online', statusColor = '#3DDC84') => ({ name, model, icon: I[icon], tint, iconBox: box(tint), readout, swatch: color ? sw(color) : none, status, statusColor });
    const pc = [
      dev('RAM stick 1', 'Corsair Vengeance RGB DDR5 · 10 LEDs', 'ram', '#B26BFF', '37.5 °C', '#36D6FF'),
      dev('RAM stick 2', 'Corsair Vengeance RGB DDR5 · 10 LEDs', 'ram', '#B26BFF', '37.2 °C', '#36D6FF'),
      dev('Graphics card', 'ASRock RX 9070 XT Taichi · 4 LEDs', 'gpu', '#FF7A50', (46 + Math.round(Math.sin(t * .4) * 2)) + ' °C', '#36D6FF'),
      dev('Motherboard', 'ROG STRIX B850-F GAMING WIFI', 'board', '#36D6FF', '38.5 °C', '#36D6FF'),
      dev('Case fans & strip', 'ARGB header · not set up yet', 'strip', '#F5A524', 'Set up', null, 'Needs setup', '#F5A524'),
      dev('Radiator fans', 'CPU_FAN header', 'fan', '#36D6FF', (1133 + Math.round(Math.sin(t * .5) * 40)).toLocaleString('en-US') + ' rpm', null),
      dev('Front & rear fans', 'Fan header 6', 'fan', '#36D6FF', '541 rpm', null),
      dev('AIO pump', 'Fixed at 100%', 'pump', '#3DDC84', '2,812 rpm', null)
    ];
    const home = [
      dev('Desk lamp', 'Yeelight colour bulb · 192.168.0.8', 'lamp', '#FF8A3D', 'On · 70%', '#FF8A3D'),
      dev('Bedside lamp', 'Yeelight colour bulb · 192.168.0.175', 'lamp', '#36D6FF', 'On · 45%', '#36D6FF')
    ];
    if (s.fryer === 'ready') home.push(dev('Air fryer', 'Careli MAF10A · 192.168.0.246', 'fryer', '#F5A524', 'Idle', null));
    const network = [
      dev('5G router', 'ZLT X17M · Ooredoo', 'router', '#F5A524', 'Fair · 47', null, 'Online', '#F5A524'),
      dev('This PC', 'HARD-Pc · 192.168.0.59', 'net', '#36D6FF', '86 Mb/s ↓', null)
    ];
    const nav = [
      { section: true, label: 'GENERAL' }, ['Dashboard', 'Main.dc.html'], ['Monitor', 'V2Monitor.dc.html'], ['Devices', 'V2Devices.dc.html'],
      { section: true, label: 'CONTROL' }, ['Lighting', 'V2Lighting.dc.html'], ['Lamps', 'V2Lamps.dc.html'], ['Fans', 'Fans.dc.html'], ['Scenes', 'Scenes.dc.html'],
      { section: true, label: 'HOME' }, ['Air fryer', '#fryer'], ['Modem', 'Modem.dc.html']
    ].map(n => Array.isArray(n) ? { link: true, section: false, label: n[0], href: n[1],
      style: 'display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 14px; ' +
        (n[0] === 'Devices' ? 'background: linear-gradient(90deg, rgba(255,77,26,.18), rgba(255,77,26,.04)); color: #F4F5F7; font-weight: 600; box-shadow: inset 2px 0 0 #FF4D1A;' : 'color: #A3A6AE;') }
      : { ...n, link: false });
    const total = pc.length + home.length + network.length;
    return {
      nav,
      headline: total + ' devices, all in one place',
      hasNew: s.fryer === 'new',
      setUp: () => this.setState({ fryer: 'ready' }), dismiss: () => this.setState({ fryer: 'dismissed' }),
      groups: [['This PC', pc], ['Home', home], ['Network', network]].map(([title, items]) => ({ title, items, count: items.length + (items.length === 1 ? ' device' : ' devices') }))
    };
  }
}
</script>
</body>
</html>
